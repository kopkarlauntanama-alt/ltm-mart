<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17304F">
<title>LTM Mart - Sistem Manajemen Toko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#17304F;--navy2:#0F2238;--ink:#1D2733;--mut:#6A7889;--bg:#EDF1F5;--card:#fff;--line:#DCE3EB;--teal:#0E8A7D;--teal-bg:#E3F4F1;--red:#C0392B;--red-bg:#FBE9E7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
h2,h3{margin:0 0 12px}
.hide{display:none!important}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:16px}
.login{background:#fff;border-radius:10px;padding:32px;width:360px;max-width:100%}
#app{display:flex;height:100vh}
.side{width:250px;background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;z-index:30}
.side .brand{padding:18px 20px;font-weight:700;font-size:17px;background:var(--navy2)}
.side ul{list-style:none;margin:0;padding:6px 0;overflow-y:auto;flex:1}
.side li{padding:10px 20px;cursor:pointer;font-size:13.5px;display:flex;gap:10px;align-items:center}
.side li:hover,.side li.on{background:rgba(255,255,255,.12)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px}
.top h3{font-size:17px;flex:1;margin:0}
#burger{display:none}
#content{flex:1;overflow-y:auto;padding:20px}
.btn{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.dan{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.6;cursor:wait}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat small{color:var(--mut);display:block;margin-bottom:4px}
.stat b{font-size:18px}
.ledger{background:var(--navy);color:#fff;border-radius:8px;padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:16px}
.ledger .big{font-size:28px;font-weight:700}
.fg{margin-bottom:12px}.fg label{display:block;font-weight:500;margin-bottom:4px}
.fg input,.fg select,.in{width:100%;padding:9px 10px;border:1px solid #C9D3DE;border-radius:6px;background:#fff}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
th{background:#F3F6F9;font-weight:600}
td.n,th.n{text-align:right}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#E8EDF3}
.badge.err{background:var(--red-bg);color:var(--red)}
#toasts{position:fixed;right:14px;top:14px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 15px;border-radius:7px;color:#fff;background:var(--navy);max-width:340px}
.toast.ok{background:var(--teal)}.toast.err{background:var(--red)}
.modal{background:#fff;border-radius:10px;padding:22px;width:420px;max-width:100%}
#modalBg{position:fixed;inset:0;background:rgba(15,34,56,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}
.ci{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:#FAFCFE}
.ci-g{display:grid;grid-template-columns:1.4fr .7fr .9fr 1fr auto;gap:8px;align-items:center;margin-top:6px}
.ci-g input,.ci-g select{width:100%;padding:6px 8px;border:1px solid #C9D3DE;border-radius:6px;background:#fff}
.totalbox{background:var(--navy);color:#fff;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.totalbox b{font-size:26px;display:block}
@media(max-width:800px){
  .side{position:fixed;left:-260px;top:0;bottom:0;transition:left .2s}.side.open{left:0}
  #burger{display:inline-block}
  .cols,.ledger{grid-template-columns:1fr}
  .ci-g{grid-template-columns:1fr 1fr}
  #content{padding:12px}
}
</style>
</head>
<body>
<div id="toasts"></div>
<datalist id="dlBc"></datalist>
<div id="modalRoot"></div>

<div id="loginPage">
  <form class="login" onsubmit="prosesLogin(event)">
    <h2>LTM Mart</h2><p>Masuk untuk mengelola toko.</p>
    <div id="loginErr" class="badge err hide" style="margin-bottom:10px;width:100%;text-align:center;white-space:normal"></div>
    <div class="fg"><label>Username</label><input id="lu" required autocomplete="username"></div>
    <div class="fg"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn pri" style="width:100%" type="submit">Masuk</button>
  </form>
</div>

<div id="app" class="hide">
  <nav class="side" id="side">
    <div class="brand">🏪 LTM Mart</div>
    <ul id="menu"></ul>
  </nav>
  <div class="main">
    <div class="top">
      <button id="burger" class="btn sm" onclick="$('side').classList.toggle('open')">☰</button>
      <h3 id="judul"></h3><span id="userBadge"></span>
      <button class="btn sm" onclick="logout()">Keluar</button>
    </div>
    <div id="content"></div>
  </div>
</div>

<script>
// GANTI DENGAN URL DEPLOYMENT WEB APP TERBARU ANDA
var API_URL = "https://script.google.com/macros/s/AKfycbwisQfCTzmPdRIWq4bm5KT7jhrzX3XTJ1JqCpxmjb19T24Cio2PgLv9JA8EhFppaJT2hQ/exec";
var TOKEN = localStorage.getItem('ltm_token') || "", S = null, C = null, PRODUK = [], PIDX = {}, CART = [], KID = '', SIBUK = false;
var JENIS = ['Eceran', 'Dus/Kodi', 'Member Eceran', 'Member Dus/Kodi'];
var POS = ['Tunai', 'Rekening BNI SWR', 'Rekening BNI Direct'];

function $(id) { return document.getElementById(id); }
function esc(s) {
  var m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return m[c]; });
}
function rp(v) { var n = Math.round(Number(v) || 0); return (n < 0 ? "-" : "") + "Rp " + Math.abs(n).toLocaleString('id-ID'); }
function fmtN(v) { return Number(v || 0).toLocaleString('id-ID'); }
function toast(msg, type) {
  var t = document.createElement('div'); t.className = 'toast ' + (type || ''); t.textContent = msg;
  $('toasts').appendChild(t); setTimeout(function () { t.remove(); }, 4000);
}
function opsiPos() { return POS.map(function (p) { return '<option>' + p + '</option>'; }).join(''); }
function bukaModal(html) { $('modalRoot').innerHTML = '<div id="modalBg"><div class="modal">' + html + '</div></div>'; }
function tutupModal() { $('modalRoot').innerHTML = ''; }

// Jalankan aksi async dengan tombol dikunci agar tidak terkirim dobel
async function jalankan(btn, fn) {
  if (SIBUK) return;
  SIBUK = true; if (btn) btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, 'err'); }
  finally { SIBUK = false; if (btn) btn.disabled = false; }
}

async function api(aksi, data) {
  var j;
  try {
    var r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ a: aksi, t: TOKEN, d: data || {} }) });
    j = await r.json();
  } catch (e) { throw new Error('Tidak dapat terhubung ke server. Periksa koneksi internet.'); }
  if (j.ok) return j.data;
  if (j.code === 'AUTH') keLogin(j.err);
  throw new Error(j.err || 'Kesalahan sistem.');
}

function keLogin(msg) {
  TOKEN = ''; localStorage.removeItem('ltm_token'); S = null; CART = []; KID = '';
  $('app').classList.add('hide'); $('loginPage').classList.remove('hide');
  if (msg) { $('loginErr').textContent = msg; $('loginErr').classList.remove('hide'); }
}

async function prosesLogin(ev) {
  ev.preventDefault();
  $('loginErr').classList.add('hide');
  var btn = $('btnLogin');
  await jalankan(btn, async function () {
    try {
      var res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ a: 'login', d: { u: $('lu').value.trim(), p: $('lp').value } }) });
      var j = await res.json();
      if (!j.ok) throw new Error(j.err || 'Gagal login');
      TOKEN = j.data.token; localStorage.setItem('ltm_token', TOKEN);
      $('lp').value = '';
      await mulaiApp(j.data);
    } catch (e) {
      $('loginErr').textContent = e.message; $('loginErr').classList.remove('hide');
    }
  });
}

function logout() { api('logout').catch(function () {}); keLogin(); }

// [kunci, ikon, judul, izin yang diperlukan (default = kunci)]
var MENU = [
  ['dashboard', '📊', 'Dashboard'], ['penjualan', '🛒', 'Kasir Penjualan'], ['riwayat', '🧾', 'Riwayat Nota'],
  ['piutang', '🧑‍💼', 'Piutang / Potong Gaji', 'riwayat'], ['stok', '📦', 'Stok Barang'], ['pemasukanBarang', '📥', 'Barang Masuk'],
  ['master', '🏷️', 'Master Barang'], ['opname', '📋', 'Stok Opname'], ['konsinyasi', '🤝', 'Konsinyasi', 'stok'],
  ['hutang', '💳', 'Hutang', 'bayarHutang'], ['pemasukanLuar', '💰', 'Pemasukan Luar'], ['operasional', '💡', 'Biaya Operasional'],
  ['gaji', '👥', 'Pembayaran Gaji'], ['mutasi', '🔄', 'Mutasi / Tarik Tunai'], ['tutupKasir', '🧮', 'Tutup Kasir'],
  ['laporan', '📈', 'Laporan Laba Rugi'], ['pengaturan', '⚙️', 'Pengaturan']
];
function boleh(izin) { return S && S.izin.indexOf(izin) >= 0; }
function menuBoleh() { return MENU.filter(function (x) { return boleh(x[3] || x[0]); }); }

function bangunMenu() {
  $('menu').innerHTML = menuBoleh().map(function (x) {
    return '<li data-k="' + x[0] + '" onclick="go(\'' + x[0] + '\')">' + x[1] + ' <span>' + esc(x[2]) + '</span></li>';
  }).join('');
}

async function mulaiApp(info) {
  S = info; C = $('content');
  $('loginPage').classList.add('hide'); $('app').classList.remove('hide');
  $('userBadge').textContent = '👤 ' + S.nama;
  bangunMenu();
  await loadProduk();
  var m = menuBoleh();
  go(m.length ? m[0][0] : 'pengaturan');
}

async function loadProduk() {
  try {
    PRODUK = await api('produk'); PIDX = {};
    PRODUK.forEach(function (p, i) { PIDX[p.barcode] = i; });
    $('dlBc').innerHTML = PRODUK.map(function (p) { return '<option value="' + esc(p.barcode) + '">' + esc(p.nama) + '</option>'; }).join('');
  } catch (e) { console.error('Gagal memuat produk', e); }
}

function cariProduk(t) { var i = PIDX[String(t).trim()]; return i === undefined ? null : PRODUK[i]; }

function go(v) {
  $('side').classList.remove('open');
  var m = MENU.filter(function (x) { return x[0] === v; })[0];
  if (m && !boleh(m[3] || m[0])) { toast('Anda tidak memiliki akses.', 'err'); return; }
  $('judul').textContent = m ? m[2] : '';
  Array.prototype.forEach.call(document.querySelectorAll('#menu li'), function (li) { li.classList.toggle('on', li.dataset.k === v); });
  C.innerHTML = '<p>Memuat...</p>';
  if (R[v]) R[v](); else C.innerHTML = '<p>Menu ini belum tersedia di tampilan web.</p>';
}

function galat(e, apa) { C.innerHTML = '<p style="color:var(--red)">Gagal memuat ' + apa + ': ' + esc(e.message) + '</p>'; }

var R = {};

/* ---------------- Dashboard ---------------- */
R.dashboard = async function () {
  try {
    var d = await api('dashboard', { f: 'bulanan' });
    C.innerHTML = '<div class="ledger"><div><small>Total Kas</small><div class="big">' + rp(d.totalKas) + '</div></div>' +
      '<div><small>Tunai</small><b>' + rp(d.tunai) + '</b></div><div><small>BNI SWR</small><b>' + rp(d.bniSwr) + '</b></div><div><small>BNI Direct</small><b>' + rp(d.bniDirect) + '</b></div></div>' +
      '<div class="stats">' +
      '<div class="stat"><small>Penjualan Hari Ini</small><b>' + rp(d.hariIni.penjualan) + '</b></div>' +
      '<div class="stat"><small>Piutang Kopkar</small><b>' + rp(d.piutangKopkar) + '</b></div>' +
      '<div class="stat"><small>Hutang Kopkar</small><b>' + rp(d.hutangKopkar) + '</b></div>' +
      '<div class="stat"><small>Hutang Supplier</small><b>' + rp(d.hutangSupplier) + '</b></div>' +
      '<div class="stat"><small>Tagihan Konsinyasi</small><b>' + rp(d.tagihanKonsinyasi) + '</b></div>' +
      '<div class="stat"><small>Nilai Persediaan</small><b>' + rp(d.nilaiPersediaan) + '</b></div>' +
      '<div class="stat"><small>Laba Bersih Bulan Ini</small><b style="color:var(--teal)">' + rp(d.labaBersih) + '</b></div></div>' +
      (d.stokMenipis && d.stokMenipis.length ? '<div class="card"><h3>Stok Menipis</h3><div class="tw"><table><thead><tr><th>Barang</th><th class="n">Stok</th><th class="n">Minimum</th></tr></thead><tbody>' +
        d.stokMenipis.map(function (x) { return '<tr><td>' + esc(x.nama) + '</td><td class="n">' + fmtN(x.stok) + ' ' + esc(x.satuan) + '</td><td class="n">' + fmtN(x.min) + '</td></tr>'; }).join('') +
        '</tbody></table></div></div>' : '');
  } catch (e) { galat(e, 'dashboard'); }
};

/* ---------------- Kasir ---------------- */
function hargaFor(p, j) {
  if (j === 'Eceran') return p.eceran;
  if (j === 'Dus/Kodi') return p.dus;
  if (j === 'Member Eceran') return p.memberEceran || p.eceran;
  return p.memberDus || p.dus;
}

R.penjualan = function () {
  C.innerHTML = '<div class="cols"><div class="card"><h3>Keranjang</h3>' +
    '<input class="in" id="pScan" list="dlBc" placeholder="Ketik/scan barcode lalu Enter" autocomplete="off" style="margin-bottom:12px">' +
    '<div id="cartList"></div></div>' +
    '<div class="card"><div class="totalbox"><small>Total Belanja</small><b id="pTotal">Rp 0</b></div>' +
    '<div class="fg"><label>Metode Pembayaran</label><select id="pMetode" onchange="ubahMetode()">' +
    '<option value="Tunai">Tunai</option><option value="BNI SWR">BNI SWR</option><option value="BNI Direct">BNI Direct</option>' +
    '<option value="Potong Gaji">Potong Gaji Karyawan</option><option value="Piutang Tempo">Piutang Tempo</option><option value="Entertaint (Gratis)">Entertaint (Gratis)</option></select></div>' +
    '<div id="boxTunai"><div class="fg"><label>Uang Diterima (opsional)</label><input id="pBayar" class="in" type="number" min="0" oninput="hitungTotal()"></div><p id="pKembali" style="margin:0 0 12px;color:var(--mut)"></p></div>' +
    '<div id="boxKredit" class="hide"><div class="fg"><label>No Register</label><input id="pNoReg" class="in"></div><div class="fg"><label>Nama Karyawan</label><input id="pKaryawan" class="in"></div></div>' +
    '<button id="btnJual" class="btn pri" style="width:100%;padding:12px" onclick="prosesJual(this)">Proses Transaksi</button></div></div>';
  $('pScan').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); tambahItem(this.value); this.value = ''; }
  });
  $('cartList').addEventListener('input', editCart);
  $('cartList').addEventListener('change', editCart);
  $('cartList').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-del]'); if (!b) return;
    CART.splice(Number(b.dataset.del), 1); renderCart();
  });
  renderCart();
};

function tambahItem(bc) {
  bc = String(bc).trim(); if (!bc) return;
  var p = cariProduk(bc); if (!p) { toast('Produk tidak ditemukan', 'err'); return; }
  var ada = CART.filter(function (x) { return x.barcode === p.barcode && x.jenis === 'Eceran'; })[0];
  if (ada) ada.qty += 1; else CART.push({ barcode: p.barcode, jenis: 'Eceran', qty: 1, pot: 0 });
  if (!KID) KID = 'k' + Date.now() + Math.random().toString(36).slice(2, 8);
  renderCart();
}

function renderCart() {
  $('cartList').innerHTML = CART.map(function (it, i) {
    var p = cariProduk(it.barcode) || { nama: it.barcode };
    return '<div class="ci"><b>' + esc(p.nama) + '</b> <small style="color:var(--mut)">' + esc(it.barcode) + ' · stok ' + fmtN(p.stok) + '</small><div class="ci-g">' +
      '<select data-i="' + i + '" data-f="jenis">' + JENIS.map(function (j) { return '<option' + (j === it.jenis ? ' selected' : '') + '>' + j + '</option>'; }).join('') + '</select>' +
      '<input type="number" min="0" step="any" value="' + it.qty + '" data-i="' + i + '" data-f="qty" title="Qty">' +
      '<input type="number" min="0" value="' + it.pot + '" data-i="' + i + '" data-f="pot" placeholder="Potongan" title="Potongan (Rp)">' +
      '<b id="sub' + i + '"></b>' +
      '<button class="btn dan sm" data-del="' + i + '">X</button></div></div>';
  }).join('') || '<p>Kosong</p>';
  hitungTotal();
}

function editCart(ev) {
  var el = ev.target, i = el.dataset.i, f = el.dataset.f; if (i === undefined) return;
  CART[i][f] = (f === 'jenis') ? el.value : Math.max(0, Number(el.value) || 0);
  hitungTotal();   // hanya hitung ulang angka, input tidak dibangun ulang (fokus tetap)
}

function hitungTotal() {
  var tot = 0;
  CART.forEach(function (it, i) {
    var p = cariProduk(it.barcode), sub = Math.max(0, it.qty * (p ? hargaFor(p, it.jenis) : 0) - it.pot);
    tot += sub; var el = $('sub' + i); if (el) el.textContent = rp(sub);
  });
  if ($('pMetode') && $('pMetode').value === 'Entertaint (Gratis)') tot = 0;
  $('pTotal').textContent = rp(tot);
  var b = $('pBayar'); if (b && $('pKembali')) $('pKembali').textContent = b.value ? ('Kembalian: ' + rp(Number(b.value) - tot)) : '';
  return tot;
}

function ubahMetode() {
  var m = $('pMetode').value;
  $('boxKredit').classList.toggle('hide', m !== 'Potong Gaji' && m !== 'Piutang Tempo');
  $('boxTunai').classList.toggle('hide', m !== 'Tunai');
  hitungTotal();
}

async function prosesJual(btn) {
  if (!CART.length) { toast('Keranjang kosong', 'err'); return; }
  await jalankan(btn, async function () {
    var m = $('pMetode').value;
    var res = await api('jual', {
      kid: KID, metodeBayar: m,
      noRegister: $('pNoReg').value, namaKaryawan: $('pKaryawan').value,
      uangDiterima: m === 'Tunai' ? $('pBayar').value : '',
      items: CART.map(function (x) { return { barcode: x.barcode, jenisHarga: x.jenis, qty: x.qty, potongan: x.pot }; })
    });
    toast('Berhasil ' + res.idNota + ' — ' + rp(res.total) + (res.bayar ? ' (kembalian ' + rp(res.kembalian) + ')' : ''), 'ok');
    CART = []; KID = '';
    await loadProduk(); R.penjualan();
  });
}

/* ---------------- Mutasi ---------------- */
R.mutasi = function () {
  C.innerHTML = '<div class="card" style="max-width:500px"><h3>Mutasi Saldo / Tarik Tunai</h3>' +
    '<div class="fg"><label>Dari Pos Asal</label><select id="mDari"><option>Rekening BNI Direct</option><option>Rekening BNI SWR</option><option>Tunai</option></select></div>' +
    '<div class="fg"><label>Ke Pos Tujuan</label><select id="mKe"><option>Tunai</option><option>Rekening BNI Direct</option><option>Rekening BNI SWR</option></select></div>' +
    '<div class="fg"><label>Nominal (Rp)</label><input id="mNom" type="number" min="0" class="in"></div>' +
    '<div class="fg"><label>Keterangan (cth: Tarik Tunai Bpk Budi)</label><input id="mKet" class="in"></div>' +
    '<button class="btn pri" onclick="simpanMutasi(this)">Simpan Mutasi</button></div>';
};

async function simpanMutasi(btn) {
  await jalankan(btn, async function () {
    var res = await api('mutasi', { dariPos: $('mDari').value, kePos: $('mKe').value, nominal: $('mNom').value, keterangan: $('mKet').value });
    toast(res, 'ok'); go('mutasi');
  });
}

/* ---------------- Stok ---------------- */
R.stok = async function () {
  try {
    var l = await api('produk');
    C.innerHTML = '<div class="card"><h3>Stok Barang</h3><input class="in" id="cariStok" placeholder="Cari nama/barcode..." style="margin-bottom:10px">' +
      '<div class="tw"><table><thead><tr><th>Barcode</th><th>Nama</th><th class="n">Stok</th><th class="n">Harga Ecer</th></tr></thead><tbody id="tbStok">' +
      l.map(function (x) {
        return '<tr data-q="' + esc((x.barcode + ' ' + x.nama).toLowerCase()) + '"><td>' + esc(x.barcode) + '</td><td>' + esc(x.nama) + '</td><td class="n">' + fmtN(x.stok) + ' ' + esc(x.satuan) + '</td><td class="n">' + rp(x.eceran) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    $('cariStok').addEventListener('input', function () {
      var q = this.value.toLowerCase();
      Array.prototype.forEach.call($('tbStok').rows, function (r) { r.classList.toggle('hide', r.dataset.q.indexOf(q) < 0); });
    });
  } catch (e) { galat(e, 'stok'); }
};

/* ---------------- Piutang ---------------- */
R.piutang = async function () {
  try {
    var d = await api('piutang');
    C.innerHTML = '<div class="card"><h3>Piutang / Potong Gaji Karyawan</h3>' +
      '<div class="tw"><table><thead><tr><th>No Reg</th><th>Karyawan</th><th class="n">Total Piutang</th><th>Aksi</th></tr></thead><tbody>' +
      (d.ringkas.map(function (x) {
        return '<tr><td>' + esc(x.noRegister) + '</td><td>' + esc(x.karyawan) + '</td><td class="n"><b>' + rp(x.total) + '</b></td>' +
          '<td><button class="btn pri sm" data-k="' + esc(x.kunci) + '" data-t="' + Number(x.total) + '" onclick="formBayarPiutang(this)">Bayar</button></td></tr>';
      }).join('') || '<tr><td colspan="4">Tidak ada piutang aktif.</td></tr>') +
      '</tbody></table></div></div>';
  } catch (e) { galat(e, 'piutang'); }
};

function formBayarPiutang(btn) {
  var k = btn.dataset.k, t = btn.dataset.t;
  bukaModal('<h3>Bayar Piutang</h3><p>' + esc(k) + ' — total ' + rp(t) + '</p>' +
    '<div class="fg"><label>Nominal (Rp)</label><input id="bpNom" class="in" type="number" min="0" max="' + Number(t) + '" value="' + Number(t) + '"></div>' +
    '<div class="fg"><label>Masuk ke</label><select id="bpPos">' + opsiPos() + '</select></div>' +
    '<div class="fg"><label>Keterangan</label><input id="bpKet" class="in"></div>' +
    '<button class="btn" onclick="tutupModal()">Batal</button> <button class="btn pri" id="bpOk">Simpan</button>');
  $('bpOk').onclick = function () {
    jalankan(this, async function () {
      var res = await api('bayarPiutang', { kunci: k, nominal: $('bpNom').value, pos: $('bpPos').value, keterangan: $('bpKet').value });
      toast(res, 'ok'); tutupModal(); R.piutang();
    });
  };
}

/* ---------------- Barang Masuk ---------------- */
R.pemasukanBarang = function () {
  C.innerHTML = '<div class="card" style="max-width:600px"><h3>Barang Masuk / Kulakan</h3>' +
    '<div class="fg"><label>Barcode</label><input id="rBc" class="in" list="dlBc" onchange="isiOtomatis()"></div>' +
    '<div class="fg"><label>Nama Barang</label><input id="rNama" class="in"></div>' +
    '<div class="grid g2"><div class="fg"><label>Jumlah Kemasan (Dus/Pcs)</label><input id="rJml" type="number" min="0" class="in"></div><div class="fg"><label>Isi per Kemasan</label><input id="rIsi" type="number" min="1" value="1" class="in"></div></div>' +
    '<div class="fg"><label>Total Bayar Kulakan (Rp)</label><input id="rTot" type="number" min="0" class="in"></div>' +
    '<div class="fg"><label>Metode Bayar</label><select id="rMetode"><option>Tunai</option><option>BNI Direct</option><option>BNI SWR</option><option>Hutang / Tempo</option></select></div>' +
    '<div class="grid g2"><div class="fg"><label>Harga Jual Eceran (opsional)</label><input id="rEc" type="number" min="0" class="in"></div><div class="fg"><label>Harga Jual Dus (opsional)</label><input id="rDus" type="number" min="0" class="in"></div></div>' +
    '<div class="fg"><label>Supplier</label><input id="rSup" class="in"></div>' +
    '<button class="btn pri" onclick="simpanRestock(this)">Simpan Barang Masuk</button></div>';
};

function isiOtomatis() {
  var p = cariProduk($('rBc').value);
  if (p) { $('rNama').value = p.nama; $('rIsi').value = p.isiDus || 1; }
}

async function simpanRestock(btn) {
  await jalankan(btn, async function () {
    var res = await api('restock', {
      barcode: $('rBc').value, namaBarang: $('rNama').value, jmlKemasan: $('rJml').value,
      isiKemasan: $('rIsi').value, totalBayar: $('rTot').value, supplier: $('rSup').value,
      statusKonsinyasi: 'Tidak', metodeBayar: $('rMetode').value, eceran: $('rEc').value, dus: $('rDus').value
    });
    toast(res, 'ok'); await loadProduk(); R.pemasukanBarang();
  });
}

/* ---------------- Pengaturan ---------------- */
R.pengaturan = function () {
  C.innerHTML = '<div class="card" style="max-width:420px"><h3>Ganti Password</h3>' +
    '<div class="fg"><label>Password Lama (kosongkan jika belum pernah dibuat)</label><input id="pwLama" type="password" class="in" autocomplete="current-password"></div>' +
    '<div class="fg"><label>Password Baru (min. 6 karakter)</label><input id="pwBaru" type="password" class="in" autocomplete="new-password"></div>' +
    '<button class="btn pri" onclick="gantiPassword(this)">Simpan Password</button></div>';
};

async function gantiPassword(btn) {
  await jalankan(btn, async function () {
    var res = await api('ubahPassword', { lama: $('pwLama').value, baru: $('pwBaru').value });
    toast(res, 'ok'); $('pwLama').value = ''; $('pwBaru').value = '';
  });
}

// Cek sesi saat halaman dimuat
(async function () {
  if (!TOKEN) return;
  try { var info = await api('me'); await mulaiApp(info); }
  catch (e) { keLogin(); }
})();
</script>
